<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#0f0f1e" />

    <!-- Primary Meta Tags -->
    <title>GameHub — Level Up Your Gaming Experience</title>
    <meta name="title" content="GameHub — Level Up Your Gaming Experience" />
    <meta
      name="description"
      content="Discover, play, and connect with millions of gamers worldwide. Your ultimate gaming destination for games, community, and more."
    />
    <meta
      name="keywords"
      content="gaming, games, game store, game library, community, esports, multiplayer"
    />
    <meta name="author" content="GameHub" />
    <meta name="robots" content="index, follow" />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/" />
    <meta property="og:title" content="GameHub — Level Up Your Gaming Experience" />
    <meta
      property="og:description"
      content="Discover, play, and connect with millions of gamers worldwide."
    />
    <meta property="og:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="GameHub — Level Up Your Gaming Experience" />
    <meta property="og:site_name" content="GameHub" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://YOUR-DOMAIN.com/" />
    <meta name="twitter:title" content="GameHub — Level Up Your Gaming Experience" />
    <meta
      name="twitter:description"
      content="Discover, play, and connect with millions of gamers worldwide."
    />
    <meta name="twitter:image" content="https://YOUR-DOMAIN.com/og-image.png" />
    <meta name="twitter:image:alt" content="GameHub — Level Up Your Gaming Experience" />
    <meta name="twitter:site" content="@YOUR-TWITTER-HANDLE" />
    <meta name="twitter:creator" content="@YOUR-TWITTER-HANDLE" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preconnect to font providers -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Fonts: Inter for UI, Orbitron for logo/branding -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Orbitron:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- PWA / Mobile -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameHub" />
    <meta name="mobile-web-app-capable" content="yes" />

    <style>
      /* ---------- Initial Loading Screen ---------- */
      html,
      body {
        margin: 0;
        padding: 0;
        background-color: #0f0f1e;
        color: #ffffff;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #initial-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        background: #0f0f1e;
        z-index: 9999;
        transition: opacity 0.4s ease;
      }

      #initial-loader.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .loader-logo {
        font-family: 'Orbitron', sans-serif;
        font-size: 42px;
        font-weight: 900;
        background: linear-gradient(135deg, #6366f1, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 2px;
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .loader-spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(99, 102, 241, 0.15);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      .loader-text {
        color: #a1a1aa;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      <div style="padding: 40px; text-align: center; font-family: sans-serif">
        <h1>JavaScript Required</h1>
        <p>GameHub requires JavaScript to run. Please enable it in your browser settings.</p>
      </div>
    </noscript>

    <!-- Initial loader (hidden once React mounts) -->
    <div id="initial-loader">
      <div class="loader-logo"><span>🎮</span> GameHub</div>
      <div class="loader-spinner"></div>
      <div class="loader-text">Loading your experience…</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      The build step will place the bundled scripts into the <body> tag.
    -->
  </body>
</html>
